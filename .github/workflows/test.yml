name: SolBot Tests

on:
  push:
    branches:
      - main
      - 'copilot/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore Websitesi.sln

      - name: Build
        run: dotnet build Websitesi.sln --no-restore

      - name: Run tests
        run: dotnet test EgeControlWebApp.Tests/EgeControlWebApp.Tests.csproj --no-build --verbosity normal
